services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyectos_frontend
    environment:
      VITE_DEV_API_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyectos_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      # Mismo Mongo que Compass ya tiene abierto en localhost:27017
      MONGODB_URI: mongodb://host.docker.internal:27017/fronted_vue
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@proyectos.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
    restart: unless-stopped
